name: library_management_system
description: "Library Management System - Internal inventory management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  injectable: ^2.5.0
  flutter_svg: ^2.0.14
  device_preview: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.5.3
  http: ^1.2.2
  intl: ^0.20.2
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.7.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/icons/
    - assets/images/icons-social-media/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/en/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/en/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/en/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/en/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/en/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/en/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/en/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/en/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/en/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/en/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/en/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/en/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/en/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/en/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/en/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/en/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/en/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/en/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Rakkas
      fonts:
        - asset: assets/fonts/ar/Rakkas-Regular.ttf
          weight: 400
